<style>
/* Layout: one app shell. Five sections behind a bottom bar (side rail on wide screens). Content is stacked cards in a 760px column; every editor opens as a sheet. */
:root{
  --bg:#f1f4f3;--surface:#ffffff;--surface-2:#e6ebea;--line:#d6dedd;--fg:#13201f;--muted:#566967;
  --accent-l:#0e7c7b;--accent-d:#52d3c6;--accent:var(--accent-l);--on-accent:#ffffff;
  --good:#287f52;--warn:#9a6208;--bad:#bb372a;
  --shadow:0 1px 2px rgba(10,30,28,.05),0 8px 20px rgba(10,30,28,.05);
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1415;--surface:#152021;--surface-2:#1d2b2c;--line:#2a3b3c;--fg:#e7f0ef;--muted:#8ea3a1;
  --accent:var(--accent-d);--on-accent:#091213;--good:#5cc98d;--warn:#e3b04f;--bad:#ff8173;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1415;--surface:#152021;--surface-2:#1d2b2c;--line:#2a3b3c;--fg:#e7f0ef;--muted:#8ea3a1;
  --accent:var(--accent-d);--on-accent:#091213;--good:#5cc98d;--warn:#e3b04f;--bad:#ff8173;--shadow:none;color-scheme:dark}
:root[data-skin="ember"]{--accent-l:#b93d0a;--accent-d:#ff9a57}
:root[data-skin="moss"]{--accent-l:#3b7a35;--accent-d:#93d886}
:root[data-skin="plum"]{--accent-l:#7a37ad;--accent-d:#cbaaf7}
:root[data-skin="ink"]{--accent-l:#26394f;--accent-d:#c9d6e4}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;font-weight:650}
h1{font-size:28px;letter-spacing:-.01em}h2{font-size:20px}h3{font-size:17px}
p{margin:0}
button{font-family:inherit}
#app{max-width:760px;margin:0 auto}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
#view{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}.center{text-align:center}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card.stack{gap:10px}
.empty{text-align:left;display:flex;flex-direction:column;gap:10px}
.sk{height:96px;border-radius:var(--r);background:var(--surface-2)}
.pill{display:inline-block;font:600 11px var(--f-body);padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:11px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 11px;min-height:32px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,.chk:focus-visible,.seg button:focus-visible,#nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 13px;border-radius:99px;font:500 13px var(--f-body);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-height:40px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.fields{display:grid;gap:12px}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.tile .ph{display:grid;place-items:center;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}

.tile .ini{font:700 34px var(--f-display);color:var(--muted)}

.tile .tb b{overflow-wrap:anywhere;font-weight:600}
.star{position:absolute;top:8px;right:8px;background:var(--bg);color:var(--accent);border-radius:99px;font-size:13px;padding:1px 7px}
.badge{position:absolute;top:8px;left:8px}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;width:34px;height:36px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.chk{display:flex;gap:12px;align-items:center;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.chk:last-child{border-bottom:0}
.box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--on-accent)}
.box svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on .box{background:var(--accent);border-color:var(--accent)}.chk.on .box svg{opacity:1}
.chk.on .lbl{color:var(--muted);text-decoration:line-through}
.heat{display:grid;grid-template-columns:repeat(var(--cols,15),1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 78%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.heat i.fut{visibility:hidden}.heat i.today{outline:1.5px solid var(--fg);outline-offset:1px}
.big{font:700 40px/1 var(--f-display)}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:12px;padding:9px 11px}
.stat b{font:500 18px var(--f-mono)}
.stats{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer}
.ing{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing-a{display:grid;grid-template-columns:62px 74px minmax(0,1fr) 34px;gap:6px;align-items:center}
.ing-b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ing input{padding:6px 8px;min-height:36px;font-size:14px}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ilist .q{flex:0 0 78px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;display:block;background:var(--surface-2)}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cookstep{font:500 24px/1.35 var(--f-display);text-wrap:pretty}
.dots{display:flex;gap:5px}.dots i{flex:1;height:4px;border-radius:9px;background:var(--surface-2)}.dots i.on{background:var(--accent)}
.sets{display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px 28px;gap:8px;align-items:center}
.set.hd{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.set .sn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:13px;color:var(--muted)}
.set em{font:700 9px var(--f-body);font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:5px;padding:1px 4px}
.set input{text-align:center;font-family:var(--f-mono)}
.tick{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.tick svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.done input{opacity:.65}
.rest{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.rest .btn{background:transparent;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 45%,transparent)}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font:10px var(--f-mono)}
.ch .gl{stroke:var(--line);stroke-width:1;fill:none}
.ch .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.ch .ar{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:none}
.ch circle{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.ch .lv{fill:var(--fg);font-weight:500}
.pv{border-radius:12px;background:var(--surface-2);min-height:120px;display:grid;place-items:center;overflow:hidden}
.pv img{width:100%;max-height:260px;object-fit:cover;display:block}
.photo{display:flex;flex-direction:column;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:0 0 auto}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:2px;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.collage span{display:block;overflow:hidden;background:var(--surface-2)}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.picks{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pick{flex:0 0 auto;width:72px;border:2px solid transparent;border-radius:12px;background:var(--surface);padding:0;cursor:pointer;overflow:hidden;color:inherit;font:inherit;text-align:center}
.pick .pi{display:block;aspect-ratio:1;background:var(--surface-2);overflow:hidden}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick small{display:block;font-size:10.5px;padding:3px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{border-color:var(--accent)}
.pick.match:not(.on){border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.rowitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:inherit;font:inherit;cursor:pointer}
.thumb{flex:0 0 auto;width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.cmp{display:grid;gap:8px;grid-template-columns:1fr 1fr}.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.daycard.today{border-color:var(--accent)}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:4px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
#nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:500 11px var(--f-body);padding:6px 4px;border-radius:12px;cursor:pointer}
#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
@media(min-width:900px){
  body{padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 92px);padding-block:0 40px}
  #nav{right:auto;top:0;bottom:0;width:88px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);
    padding:calc(20px + env(safe-area-inset-top,0px)) 8px 20px max(8px,env(safe-area-inset-left,0px))}
  #nav button{flex:0 0 auto;max-width:none}
}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .bd{position:absolute;inset:0;background:rgba(6,14,14,.55)}
#sheet .panel{position:relative;width:100%;max-width:640px;max-height:92%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet .panel.full{height:96%}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#sheet .pb{overflow-y:auto;flex:1;min-height:0;padding:6px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
#sheet .pf{display:flex;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
#sheet .pf .btn{flex:1}
@media(min-width:700px){#sheet{align-items:center}#sheet .panel{border-radius:20px;max-height:88%}#sheet .panel.full{height:88%}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font:600 13px var(--f-body);max-width:90%;text-align:center}
@media(min-width:900px){#toast{bottom:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <header id="top">
    <div class="grow"><div class="eyebrow">Upkeep</div><h1 id="title">Today</h1></div>
    <span id="sync" class="pill">Loading</span>
    <button class="btn ghost sm" data-act="settings" aria-label="Settings">Settings</button>
  </header>
  <main id="view"></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
var root=document.documentElement;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
var pad=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fromKey=function(k){var p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
var todayK=function(){return dkey(new Date())};
var addDays=function(k,n){var d=fromKey(k);d.setDate(d.getDate()+n);return dkey(d)};
var diffDays=function(a,b){return Math.round((fromKey(b)-fromKey(a))/864e5)};
var weekStart=function(k){return addDays(k,-((fromKey(k).getDay()+6)%7))};
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON_FIRST=[1,2,3,4,5,6,0];
var fmtDate=function(k,o){return fromKey(k).toLocaleDateString(undefined,o||{day:'numeric',month:'short'})};
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var r1=function(n){return Math.round(n*10)/10};
var fmtQ=function(q){return q==null||q===''?'':String(Math.round(num(q)*100)/100)};
var mmss=function(s){return Math.floor(s/60)+':'+pad(s%60)};
var lsGet=function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
var lsSet=function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
var lsDel=function(k){try{localStorage.removeItem(k)}catch(e){}};
var ago=function(k){var d=diffDays(k,todayK());return d<=0?'today':d===1?'yesterday':d+' d ago'};
var byDateDesc=function(a,b){return a.date<b.date?1:a.date>b.date?-1:((b.at||0)-(a.at||0))};
var byDateAsc=function(a,b){return byDateDesc(b,a)};
var TICK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

var COLS=['recipes','plan','cooked','templates','sessions','body','items','outfits','wears','routines','checks','products','groom','reminders','photos','gwish','meta'];
var S={};COLS.forEach(function(c){S[c]={}});
var list=function(c){return Object.keys(S[c]).map(function(k){return S[c][k]})};
var base=null,mode='local',ready=false,writeFail=false,queues={};

function persist(col,id,obj){
  if(mode==='cloud'){
    var key=col+'/'+id;
    queues[key]=(queues[key]||Promise.resolve()).then(function(){
      var ref=base.collection(col).doc(id);
      var p=obj?ref.set(JSON.parse(JSON.stringify(obj))):ref.delete();
      return p.then(function(){if(writeFail){writeFail=false;syncChip()}});
    }).catch(function(e){
      writeFail=true;syncChip();
      toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some photos.':'Could not save. This page needs Contributor access to store your data.');
    });
  }else saveLocal();
}
function put(col,obj){var o=Object.assign({},obj);if(!o.id)o.id=uid();var m=Object.assign({},S[col]);m[o.id]=o;S[col]=m;persist(col,o.id,o);schedule();return o.id}
function del(col,id){var m=Object.assign({},S[col]);delete m[id];S[col]=m;persist(col,id,null);schedule()}
var lt=null;
function saveLocal(){clearTimeout(lt);lt=setTimeout(function(){if(!lsSet('upkeep.data.v1',S)&&!writeFail){writeFail=true;syncChip();toast('This device is out of storage space.')}},300)}

function setReady(){if(ready)return;ready=true;schedule()}
function initStore(){
  var p;
  try{p=(window.claude&&window.claude.use)?Promise.all([window.claude.use('db'),window.claude.use('user')]):Promise.resolve([null,null])}catch(e){p=Promise.resolve([null,null])}
  p.then(function(r){
    var db=r[0],user=r[1];
    return (user?user.id():Promise.resolve(null)).then(function(id){return [db,id]});
  }).catch(function(){return [null,null]}).then(function(r){
    var db=r[0],id=r[1];
    if(db&&id){
      base=db.doc('data/users/'+id+'/app');mode='cloud';
      var pend=COLS.length,seen={};
      var done=function(c){if(!seen[c]){seen[c]=1;pend--;if(pend<=0)setReady()}};
      COLS.forEach(function(c){
        base.collection(c).onSnapshot(function(snap){
          var m={};snap.docs.forEach(function(d){m[d.id]=Object.assign({},d.data(),{id:d.id})});S[c]=m;
          if(!snap.metadata.fromCache)done(c);
          if(c==='meta')applyTheme();
          schedule();
        },function(){done(c)});
      });
      setTimeout(setReady,3500);
    }else{
      var d=lsGet('upkeep.data.v1');if(d)COLS.forEach(function(c){S[c]=d[c]||{}});
      mode='local';setReady();
    }
    syncChip();
  });
}
function syncChip(){
  var el=$('#sync');if(!el)return;
  var t,c='pill';
  if(!ready){t='Loading'}else if(mode==='cloud'){if(writeFail){t='Not saving';c+=' bad'}else{t='Synced';c+=' good'}}else{t='This device only';c+=' warn'}
  el.className=c;el.textContent=t;
}

function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,(max||560)/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q||.72));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function chart(pts){
  if(!pts.length)return '';
  var W=320,H=160,L=38,R=14,T=14,B=24;
  var lo=Math.min.apply(null,pts.map(function(p){return p.y})),hi=Math.max.apply(null,pts.map(function(p){return p.y}));
  var dMin=lo,dMax=hi;if(hi-lo<1e-9){lo-=1;hi+=1}
  var pd=(hi-lo)*.15;lo-=pd;hi+=pd;
  var X=function(i){return pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1)};
  var Y=function(v){return T+(hi-v)*(H-T-B)/(hi-lo)};
  var ticks=[dMin,(dMin+dMax)/2,dMax];if(dMax-dMin<1e-9)ticks=[dMin];
  var grid=ticks.map(function(t){return '<path class="gl" d="M'+L+' '+Y(t).toFixed(1)+'H'+(W-R)+'"/><text x="'+(L-5)+'" y="'+(Y(t)+3).toFixed(1)+'" text-anchor="end">'+r1(t)+'</text>'}).join('');
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)}).join('');
  var area=pts.length>1?'<path class="ar" d="'+d+'L'+X(pts.length-1).toFixed(1)+' '+(H-B)+'L'+X(0).toFixed(1)+' '+(H-B)+'Z"/>':'';
  var dots=pts.map(function(p,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?4.5:3)+'"/>'}).join('');
  var last=pts[pts.length-1];
  var lab='<text class="lv" x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(last.y)-9).toFixed(1)+'" text-anchor="end">'+r1(last.y)+'</text>';
  var xs='<text x="'+L+'" y="'+(H-6)+'">'+esc(fmtDate(pts[0].x))+'</text>'+(pts.length>1?'<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(fmtDate(last.x))+'</text>':'');
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Trend chart">'+grid+area+(pts.length>1?'<path class="ln" d="'+d+'"/>':'')+dots+lab+xs+'</svg>';
}
function heat(m,weeks){
  weeks=weeks||15;var t=todayK(),dow=(fromKey(t).getDay()+6)%7,start=addDays(t,-dow-(weeks-1)*7),h='';
  for(var i=0;i<weeks*7;i++){var k=addDays(start,i),v=m[k]||0,fut=k>t;h+='<i class="'+(fut?'fut':'l'+Math.min(4,v))+(k===t?' today':'')+'" title="'+k+': '+v+'"></i>'}
  return '<div class="heat" style="--cols:'+weeks+'">'+h+'</div>';
}
function streaks(m){
  var days=Object.keys(m).filter(function(k){return m[k]>0}).sort(),best=0,run=0,prev=null;
  days.forEach(function(k){run=prev&&diffDays(prev,k)===1?run+1:1;best=Math.max(best,run);prev=k});
  var cur=0,k=todayK();if(!(m[k]>0))k=addDays(k,-1);
  while(m[k]>0){cur++;k=addDays(k,-1)}
  return {cur:cur,best:best};
}
function activity(){
  var m={},add=function(k,n){if(k)m[k]=(m[k]||0)+n};
  list('sessions').forEach(function(s){add(s.date,2)});
  list('checks').forEach(function(c){if(Object.keys(c.done||{}).some(function(k){return c.done[k]}))add(c.date,1)});
  list('wears').forEach(function(w){add(w.date,1)});
  list('cooked').forEach(function(c){add(c.date,1)});
  return m;
}

var ac=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){try{if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.4);if(navigator.vibrate)navigator.vibrate(220)}catch(e){}}
function Timer(){
  var t={end:0,iv:null,cb:null};
  t.running=function(){return !!t.iv};
  t.tick=function(){
    if(!t.end)return;
    var l=Math.max(0,Math.ceil((t.end-Date.now())/1000));
    if(t.cb)t.cb(l);
    if(l<=0){clearInterval(t.iv);t.iv=null;t.end=0;beep()}
  };
  t.start=function(s){unlockAudio();clearInterval(t.iv);t.end=Date.now()+s*1000;t.iv=setInterval(t.tick,250);t.tick()};
  t.add=function(s){if(t.end){t.end+=s*1000;t.tick()}};
  t.stop=function(){clearInterval(t.iv);t.iv=null;t.end=0;if(t.cb)t.cb(null)};
  return t;
}

function todaysTemplate(){

function routineItems(kind,date){

  return list('routines').filter(function(r){return r.routine===kind&&(kind!=='weekly'||r.day===dow)}).sort(function(a,b){return (a.order||0)-(b.order||0)||String(a.label).localeCompare(String(b.label))});

function routineProgress(date){
  var done=(S.checks[date]&&S.checks[date].done)||{},out={};
  ['am','pm','weekly'].forEach(function(k){var it=routineItems(k,date);out[k]={total:it.length,done:it.filter(function(i){return done[i.id]}).length}});
  return out;
}
function remDue(r){
  var last=r.last||null;
  if(r.type){var lg=list('groom').filter(function(g){return g.type===r.type}).map(function(g){return g.date}).sort().pop();if(lg&&(!last||lg>last))last=lg}
  var due=addDays(last||r.created||todayK(),num(r.every)||7);
  return {due:due,days:diffDays(todayK(),due),last:last};
}
function prodExpiry(p){
  if(p.expires)return p.expires;
  if(p.opened&&num(p.pao)>0){var d=fromKey(p.opened);d.setMonth(d.getMonth()+num(p.pao));return dkey(d)}
  return null;
}
function prodStatus(p){
  var e=prodExpiry(p);if(!e)return null;var d=diffDays(todayK(),e);
  return d<0?{t:'bad',s:'Expired '+(-d)+' d ago',d:d}:d<=30?{t:'warn',s:'Expires in '+d+' d',d:d}:{t:'',s:'Expires '+fmtDate(e,{month:'short',year:'numeric'}),d:d};

function recipeTotals(r){var t={kcal:0,p:0,c:0,f:0};(r.ings||[]).forEach(function(i){t.kcal+=num(i.kcal);t.p+=num(i.p);t.c+=num(i.c);t.f+=num(i.f)});var s=Math.max(1,num(r.servings)||1);return {kcal:t.kcal/s,p:t.p/s,c:t.c/s,f:t.f/s}}
function hasMacros(r){return (r.ings||[]).some(function(i){return num(i.kcal)||num(i.p)||num(i.c)||num(i.f)})}
function matchRecipe(r,q){

var e1rm=function(kg,reps){return reps<=0?0:reps===1?kg:kg*(1+reps/30)};
var metric=function(kg,reps){return kg>0?e1rm(kg,reps):reps};
function exHistory(name){
  var key=String(name).trim().toLowerCase(),out=[];
  list('sessions').sort(byDateAsc).forEach(function(s){(s.exercises||[]).forEach(function(e){if(String(e.name).trim().toLowerCase()===key)out.push({date:s.date,sets:e.sets||[]})})});

}
function lastSets(name){var h=exHistory(name);return h.length?h[h.length-1].sets:null}
function bestMetric(name){var b=0;exHistory(name).forEach(function(h){h.sets.forEach(function(s){b=Math.max(b,metric(num(s.kg),num(s.reps)))})});return b}
function exNames(){var m={};list('sessions').forEach(function(s){(s.exercises||[]).forEach(function(e){m[e.name]=(m[e.name]||0)+1})});list('templates').forEach(function(t){(t.ex||[]).forEach(function(e){if(!m[e.name])m[e.name]=0})});return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b)})}

function gymProgress(){
  var names=exNames().filter(function(n){return exHistory(n).length}),sessions=list('sessions');
  var wk=weekStart(todayK()),thisWk=sessions.filter(function(s){return s.date>=wk}).length;
  var target={};list('templates').forEach(function(t){(t.days||[]).forEach(function(d){target[d]=1})});var tg=Object.keys(target).length;
  var hm={};sessions.forEach(function(s){hm[s.date]=(hm[s.date]||0)+2});
  var h='<div class="card stack"><div class="row between"><div class="eyebrow">This week</div><span class="mono"><b>'+thisWk+'</b>'+(tg?' / '+tg:'')+' workouts</span></div>'+heat(hm,15)+'</div>';
  if(!names.length)return h+emptyCard('No lifts logged yet','Finish a workout and your personal records and trends show up here.',[['wk-empty','Start a workout','primary']]);
  var sel=names.indexOf(ui.exSel)>-1?ui.exSel:names[0];
  h+='<div class="card stack"><label class="f">Exercise<select id="exsel" data-ch="exsel">'+opts(names,sel)+'</select></label><div id="exchart">'+exChart(sel)+'</div></div>';
  var prs=names.map(function(n){var best=null,bm=0;exHistory(n).forEach(function(x){x.sets.forEach(function(s){var m=metric(num(s.kg),num(s.reps));if(m>bm){bm=m;best=s}})});return {n:n,s:best,m:bm}}).sort(function(a,b){return b.m-a.m}).slice(0,8);
  h+='<div class="card stack"><div class="eyebrow">Personal bests</div>'+prs.map(function(p){return '<div class="row between"><span>'+esc(p.n)+'</span><span class="mono">'+(num(p.s.kg)>0?esc(p.s.kg)+' kg × '+esc(p.s.reps):esc(p.s.reps)+' reps')+'</span></div>'}).join('')+'</div>';

function exChart(name){
  var hist=exHistory(name),pts=hist.map(function(x){var b=0;x.sets.forEach(function(s){b=Math.max(b,metric(num(s.kg),num(s.reps)))});return {x:x.date,y:b}});
  var bw=hist.length&&hist[0].sets.every(function(s){return num(s.kg)===0});
  var best=Math.max.apply(null,pts.map(function(p){return p.y}));
  return chart(pts)+'<div class="row between small muted"><span>'+(bw?'Best reps per session':'Best estimated 1RM per session (kg)')+'</span><span class="mono">Best '+r1(best)+' · '+pts.length+' sessions</span></div>';
}

function checkBlock(title,kind,t){
  var items=routineItems(kind,t),done=(S.checks[t]&&S.checks[t].done)||{};if(!items.length)return '';
  var n=items.filter(function(i){return done[i.id]}).length;
  return '<div class="card"><div class="row between" style="margin-bottom:8px"><b>'+title+'</b><span class="mono small muted">'+n+'/'+items.length+'</span></div><div class="bar"><i style="width:'+Math.round(n/items.length*100)+'%"></i></div>'+items.map(function(i){return '<button class="chk'+(done[i.id]?' on':'')+'" data-act="chk" data-id="'+esc(i.id)+'"><span class="box">'+TICK+'</span><span class="lbl">'+esc(i.label)+'</span></button>'}).join('')+'</div>';
}
function groomToday(){
  var t=todayK(),h='';
  var blocks=checkBlock('Morning','am',t)+checkBlock('Night','pm',t)+checkBlock('Weekly, today','weekly',t);
  if(!list('routines').length)h+=emptyCard('No routines yet','Add morning, night and weekly steps to tick off each day. Start from a basic set if you like.',[['starter-groom','Add starter set','primary'],['rt-edit','Build my own']]);
  else{h+=blocks||'<div class="card muted">Nothing scheduled today.</div>';h+='<div><button class="btn sm" data-act="rt-edit">Edit routines</button></div>'}
  var rs=list('reminders').map(function(r){return {r:r,d:remDue(r)}}).sort(function(a,b){return a.d.days-b.d.days});
  h+='<div class="card stack"><div class="row between"><div class="eyebrow">Reminders</div><button class="btn sm" data-act="rem-new">Add</button></div>';
  if(!rs.length)h+='<span class="muted small">Recurring tasks like a haircut or a new razor blade appear here when due.</span>';
  rs.forEach(function(x){var d=x.d.days,cls=d<0?'bad':d<=2?'warn':'';h+='<div class="row"><button class="chk grow" style="border:0;padding:6px 0" data-act="rem" data-id="'+esc(x.r.id)+'"><span class="grow"><b>'+esc(x.r.label)+'</b><br><span class="small muted">Every '+esc(x.r.every)+' days'+(x.d.last?' · last '+esc(ago(x.d.last)):'')+'</span></span><span class="pill '+cls+'">'+(d<0?(-d)+' d overdue':d===0?'Due today':'In '+d+' d')+'</span></button><button class="btn sm" data-act="rem-done" data-id="'+esc(x.r.id)+'">Done</button></div>'});

ACT['set-done']=function(el){
  var row=el.closest('.set'),ex=DR.exercises[+row.dataset.e],s=ex.sets[+row.dataset.s];
  s.done=!s.done;
  if(s.done){
    var kg=num(s.kg),rp=num(s.reps);
    if(rp<=0){s.done=false;toast('Enter the reps first');return}
    var m=metric(kg,rp),best=bestMetric(ex.name);
    ex.sets.forEach(function(o){if(o!==s&&o.done)best=Math.max(best,metric(num(o.kg),num(o.reps)))});
    s.pr=best>0&&m>best+1e-9;if(s.pr)toast('New PR: '+ex.name);
    var rs=cfg().restSec==null?90:num(cfg().restSec);if(rs>0)RT.start(rs);
  }else s.pr=false;
  row.classList.toggle('done',s.done);el.setAttribute('aria-pressed',s.done?'true':'false');
  var pr=$('.pr',row);if(pr)pr.hidden=!s.pr;saveDraft();
};
